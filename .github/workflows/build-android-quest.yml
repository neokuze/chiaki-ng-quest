name: Build Android (Quest)

on:
  push:
    branches: [main, immersive]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: >
          git submodule update --init --depth 1
          android/app/src/main/cpp/oboe
          third-party/curl
          third-party/gf-complete
          third-party/jerasure
          third-party/nanopb

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install --upgrade protobuf

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chiaki-quest.jks"
          {
            echo "chiakiKeystore=$RUNNER_TEMP/chiaki-quest.jks"
            echo "chiakiKeystorePW=$KEYSTORE_PASSWORD"
            echo "chiakiKeyAlias=$KEY_ALIAS"
            echo "chiakiKeyPW=$KEYSTORE_PASSWORD"
          } > android/local.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-quest-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
